<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BridgeGuards4EducatedSudan - Educational Continuity Map</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f8f9fa; }
        #map { height: 100vh; width: 100%; }
        
        .header-box {
            position: absolute; top: 15px; left: 60px; z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px; border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            border-left: 6px solid #d9534f;
            max-width: 420px;
        }
        .header-box h2 { margin: 0; color: #333; font-size: 20px; }
        .header-box p { margin: 8px 0 0; color: #666; font-size: 13px; line-height: 1.4; }

        .info {
            padding: 12px; background: white; background: rgba(255,255,255,0.95);
            box-shadow: 0 0 15px rgba(0,0,0,0.1); border-radius: 5px;
            font-size: 14px; color: #333; line-height: 1.6;
        }
        .info h4 { margin: 0 0 10px; color: #d9534f; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        
        .legend { line-height: 20px; color: #555; }
        .legend i { width: 18px; height: 18px; float: left; margin-right: 10px; opacity: 0.8; border-radius: 2px; }
    </style>
</head>
<body>

<div class="header-box">
    <h2>Sudan: Educational Continuity Map</h2>
    <p>Monitoring conflict risks and IDP student influx to safeguard learning environments for displaced children.</p>
</div>

<div id="map"></div>

<!-- External Libraries -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<script>
    // Initialize Map
    const map = L.map('map').setView([15.5, 30.0], 6);

    // Add Base Layer
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Color Logic for Conflict Risk Score
    function getRiskColor(score) {
        return score > 80 ? '#B22222' : // FireBrick (Critical)
               score > 60 ? '#FF4500' : // OrangeRed (High)
               score > 40 ? '#FFD700' : // Gold (Moderate)
               score > 20 ? '#ADFF2F' : // GreenYellow (Low)
                            '#228B22';   // ForestGreen (Safe)
    }

    // Radius Logic based on IDP Students Added
    function getRadius(count) {
        return Math.sqrt(count) * 0.1 + 5;
    }

    // Load and Parse CSV Data
    Papa.parse('data.csv', {
        download: true,
        header: true,
        skipEmptyLines: true,
        transformHeader: function(h) {
            return h.trim(); // Crucial: Fixes "undefined" by removing whitespace from headers
        },
        complete: function(results) {
            console.log("Parsed CSV Results:", results.data);
            
            results.data.forEach(function(row) {
                const lat = parseFloat(row.Latitude);
                const lon = parseFloat(row.Longitude);
                const idpCount = parseInt(row.IDP_Students_Added) || 0;
                const riskScore = parseFloat(row.Conflict_Risk_Score) || 0;
                const locality = row.Locality || "Unknown Locality";
                const state = row.State || "Unknown State";

                if (!isNaN(lat) && !isNaN(lon)) {
                    const circle = L.circleMarker([lat, lon], {
                        radius: getRadius(idpCount),
                        fillColor: getRiskColor(riskScore),
                        color: "#fff",
                        weight: 1,
                        opacity: 1,
                        fillOpacity: 0.8
                    }).addTo(map);

                    // Robust Popup Template
                    const popupContent = `
                        <div class="info">
                            <h4>${locality}</h4>
                            <b>State:</b> ${state}<br>
                            <b>IDP Students Added:</b> ${idpCount.toLocaleString()}<br>
                            <b>Conflict Risk Score:</b> ${riskScore.toFixed(1)}%<br>
                            <hr>
                            <small>Conflict Events (Recent): ${row.Conflict_Events || 0}</small><br>
                            <small>Fatalities (Recent): ${row.Conflict_Deaths || 0}</small>
                        </div>
                    `;
                    circle.bindPopup(popupContent);
                    
                    // Hover effects
                    circle.on('mouseover', function (e) {
                        this.openPopup();
                        this.setStyle({ weight: 3, color: '#666' });
                    });
                    circle.on('mouseout', function (e) {
                        this.setStyle({ weight: 1, color: '#fff' });
                    });
                }
            });
        },
        error: function(err) {
            console.error("Error parsing CSV:", err);
        }
    });

    // Add Legend
    const legend = L.control({ position: 'bottomright' });

    legend.onAdd = function (map) {
        const div = L.DomUtil.create('div', 'info legend');
        const grades = [0, 20, 40, 60, 80];
        const labels = ['<strong>Conflict Risk Score</strong>'];

        for (let i = 0; i < grades.length; i++) {
            div.innerHTML +=
                '<i style="background:' + getRiskColor(grades[i] + 1) + '"></i> ' +
                grades[i] + (grades[i + 1] ? '&ndash;' + grades[i + 1] + '%' : '+%') + '<br>';
        }
        return div;
    };

    legend.addTo(map);

</script>
</body>
</html>
