<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudan Education Continuity Map - Safe Learning Corridors</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f4f9; }
        #map { height: 100vh; width: 100%; }
        .info { padding: 12px; font: 14px/16px Arial, Helvetica, sans-serif; background: white; background: rgba(255,255,255,0.9); box-shadow: 0 0 15px rgba(0,0,0,0.2); border-radius: 5px; color: #333; width: 250px; }
        .info h4 { margin: 0 0 5px; color: #d9534f; }
        .legend { line-height: 18px; color: #555; background: white; padding: 10px; border-radius: 5px; box-shadow: 0 0 15px rgba(0,0,0,0.2); }
        .legend i { width: 18px; height: 18px; float: left; margin-right: 8px; opacity: 0.7; }
        .header-box { position: absolute; top: 10px; left: 50px; z-index: 1000; background: rgba(255,255,255,0.9); padding: 15px; border-radius: 8px; border-left: 5px solid #d9534f; max-width: 400px; }
        .header-box h2 { margin: 0; font-size: 18px; }
        .header-box p { margin: 5px 0 0; font-size: 13px; color: #666; }
    </style>
</head>
<body>

<div class="header-box">
    <h2>Sudan: Safe Learning Corridors</h2>
    <p>Overlay of 2024-2026 Conflict Intensity and IDP Influx to identify education continuity zones for displaced children.</p>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const map = L.map('map').setView([15.0, 30.0], 6);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Control that shows state info on hover
    const info = L.control();

    info.onAdd = function (map) {
        this._div = L.DomUtil.create('div', 'info');
        this.update();
        return this._div;
    };

    info.update = function (props) {
        this._div.innerHTML = '<h4>Locality Details</h4>' +  (props ?
            '<b>' + props.adm2_name + '</b><br />' +
            'State: ' + props.adm1_name + '<br />' +
            'IDP Count: ' + props.idp_count.toLocaleString() + '<br />' +
            'Recent Conflict Events: ' + props.conflict_events + '<br />' +
            'Recent Fatalities: ' + props.conflict_deaths + '<br />' +
            '<b>Safety Score: ' + Math.round(props.safety_score) + '%</b>'
            : 'Hover over a locality');
    };

    info.addTo(map);

    // Get color based on safety score
    function getColor(d) {
        return d > 80 ? '#228B22' : // ForestGreen
               d > 60 ? '#9ACD32' : // YellowGreen
               d > 40 ? '#FFD700' : // Gold
               d > 20 ? '#FF8C00' : // DarkOrange
                        '#B22222';   // FireBrick
    }

    function style(feature) {
        return {
            fillColor: getColor(feature.properties.safety_score),
            weight: 1,
            opacity: 1,
            color: 'white',
            dashArray: '3',
            fillOpacity: 0.7
        };
    }

    function highlightFeature(e) {
        const layer = e.target;
        layer.setStyle({
            weight: 3,
            color: '#666',
            dashArray: '',
            fillOpacity: 0.9
        });
        layer.bringToFront();
        info.update(layer.feature.properties);
    }

    function resetHighlight(e) {
        geojson.resetStyle(e.target);
        info.update();
    }

    function onEachFeature(feature, layer) {
        layer.on({
            mouseover: highlightFeature,
            mouseout: resetHighlight
        });
    }

    let geojson;
    fetch('data/sudan_map_data.json')
        .then(response => response.json())
        .then(data => {
            geojson = L.geoJson(data, {
                style: style,
                onEachFeature: onEachFeature
            }).addTo(map);
        });

    const legend = L.control({position: 'bottomright'});

    legend.onAdd = function (map) {
        const div = L.DomUtil.create('div', 'info legend');
        const grades = [0, 20, 40, 60, 80];
        const labels = ['<strong>Safety Score</strong>'];

        for (let i = 0; i < grades.length; i++) {
            div.innerHTML +=
                labels.push(
                '<i style="background:' + getColor(grades[i] + 1) + '"></i> ' +
                grades[i] + (grades[i + 1] ? '&ndash;' + grades[i + 1] + '%' : '+%'));
        }
        div.innerHTML = labels.join('<br>');
        return div;
    };

    legend.addTo(map);

</script>
</body>
</html>
