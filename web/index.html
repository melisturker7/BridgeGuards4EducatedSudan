<!DOCTYPE html>
<html>
<head>
    <title>BridgeGuards Sudan - Decision Support Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- PapaParse for CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #map { height: 100vh; width: 100vw; }
        .legend {
            position: absolute; bottom: 30px; left: 20px; z-index: 1000;
            background: white; padding: 15px; border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.3); max-width: 250px;
        }
        .legend h2 { margin: 0 0 10px; font-size: 18px; color: #2c3e50; }
        .dot { height: 12px; width: 12px; border-radius: 50%; display: inline-block; margin-right: 8px; }
    </style>
</head>
<body>
    <div class="legend">
        <h2>BridgeGuards Sudan</h2>
        <p style="font-size: 13px; color: #7f8c8d;">Prioritizing schools based on IDP influx and conflict risk.</p>
        <hr>
        <div style="font-size: 14px; line-height: 2;">
            <span class="dot" style="background-color: #31a354;"></span> Low Risk / High Priority<br>
            <span class="dot" style="background-color: #fd8d3c;"></span> Medium Risk / Monitoring<br>
            <span class="dot" style="background-color: #e31a1c;"></span> High Risk / Suspended
            <hr>
            <div style="font-size: 12px; margin-top: 5px;">
                <b>Student/Teacher Ratio (Shape):</b><br>
                <span style="font-size: 16px;">▲</span> 0-35 (Low)<br>
                <span style="font-size: 16px;">■</span> 36-70 (Medium)<br>
                <span style="font-size: 16px;">●</span> 71+ (High)
            </div>
        </div>
    </div>
    
    <div id="map"></div>

    <script>
        var map = L.map('map').setView([15.0, 31.0], 5);
        var baseLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        // Layer Groups
        var localityLayer = L.layerGroup().addTo(map);
        var schoolsLayer = L.layerGroup();

        function getColor(risk) {
            if (!risk) return '#31a354';
            var r = risk.trim().toLowerCase();
            return r === 'high' ? '#e31a1c' : r === 'medium' ? '#fd8d3c' : '#31a354';
        }

        function getShapeIcon(ratio, color, size) {
            var ratioVal = parseFloat(ratio) || 0;
            var pixelSize = size * 2;
            var svg = '';
            
            if (ratioVal <= 35) {
                // Triangle
                svg = `<svg width="${pixelSize}" height="${pixelSize}" viewBox="0 0 100 100"><path d="M 50,5 L 95,90 L 5,90 Z" fill="${color}" stroke="#000" stroke-width="5" fill-opacity="0.8"/></svg>`;
            } else if (ratioVal <= 70) {
                // Square
                svg = `<svg width="${pixelSize}" height="${pixelSize}" viewBox="0 0 100 100"><rect x="10" y="10" width="80" height="80" fill="${color}" stroke="#000" stroke-width="5" fill-opacity="0.8"/></svg>`;
            } else {
                // Circle
                svg = `<svg width="${pixelSize}" height="${pixelSize}" viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="${color}" stroke="#000" stroke-width="5" fill-opacity="0.8"/></svg>`;
            }
            
            return L.divIcon({
                html: svg,
                className: '',
                iconSize: [pixelSize, pixelSize],
                iconAnchor: [size, size]
            });
        }

        // 1. Load Locality Data (data.csv)
        var csvUrl = "../data/processed/data.csv";
        Papa.parse(csvUrl, {
            download: true,
            header: true,
            dynamicTyping: true,
            skipEmptyLines: true,
            transformHeader: function(h) { return h.trim(); },
            complete: function(results) {
                results.data.forEach(function(row) {
                    if(row.Latitude && row.Longitude) {
                        var riskColor = getColor(row.Conflict_Risk_Score);
                        var idpCount = row.IDP_Students_Added || 0;
                        var radiusSize = Math.sqrt(idpCount) * 0.08 + 6;

                        var marker = L.marker([row.Latitude, row.Longitude], {
                            icon: getShapeIcon(row.Student_Teacher_Ratio, riskColor, radiusSize)
                        }).addTo(localityLayer);

                        marker.bindPopup(`
                            <strong style="font-size:14px;">${row.School_Name}</strong><br><br>
                            <b>IDP Students Added:</b> ${idpCount.toLocaleString()}<br>
                            <b>AI Risk Score:</b> <span style="color:${riskColor}; font-weight:bold;">${row.Conflict_Risk_Score}</span><br>
                            <hr>
                            <b>Locality Capacity:</b><br>
                            • Total Schools: ${row.Total_Schools || 0}<br>
                            • Total Students: ${(parseInt(row.Total_Students) || 0).toLocaleString()}<br>
                            • Student/Teacher Ratio: ${row.Student_Teacher_Ratio || "N/A"}<br>
                            <hr>
                            <b>Recommendation:</b> <span style="color:#2980b9;">${row.Action_Recommendation}</span><br>
                            <small style="color:#7f8c8d;">Status: ${row.Last_Conflict_Event}</small>
                        `);
                    }
                });
            }
        });

        // 2. Load School Facilities (GeoJSON)
        fetch('data/sudan_schools.json')
            .then(res => res.json())
            .then(data => {
                L.geoJSON(data, {
                    pointToLayer: function (feature, latlng) {
                        return L.circleMarker(latlng, {
                            radius: 4,
                            fillColor: "#2980b9",
                            color: "#fff",
                            weight: 1,
                            opacity: 1,
                            fillOpacity: 0.9
                        });
                    },
                    onEachFeature: function (feature, layer) {
                        // Prioritize English Name
                        var name = feature.properties['name:en'] || 
                                   feature.properties['name'] || 
                                   feature.properties['name:ar'] || 
                                   "Unnamed School";
                        
                        layer.bindPopup(`
                            <div style="font-family: sans-serif;">
                                <b style="color:#2980b9;">School Facility</b><br>
                                <strong>${name}</strong><br>
                                <hr style="margin:5px 0;">
                                <small>Type: ${feature.properties.amenity || 'N/A'}</small><br>
                                <small>OSM ID: ${feature.properties.osm_id}</small>
                            </div>
                        `);
                    }
                }).addTo(schoolsLayer);
            });

        // Layer Control
        var overlayMaps = {
            "Locality Metrics": localityLayer,
            "School Facilities (OSM)": schoolsLayer
        };
        L.control.layers(null, overlayMaps, { collapsed: false }).addTo(map);
    </script>
</body>
</html>
